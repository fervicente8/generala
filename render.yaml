# Render Blueprint – Generala
# https://docs.render.com/blueprint-spec
# Conectá el repo y configurá las env vars en el dashboard (te las pide al usar el blueprint).

services:
  - type: web
    runtime: node
    name: generala

    buildCommand: npm install && npm run build && npx prisma migrate deploy
    startCommand: npm start

    # Render asigna PORT automáticamente; el resto lo configurás en el dashboard
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: NEXTAUTH_SECRET
        sync: false
      - key: NEXTAUTH_URL
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
